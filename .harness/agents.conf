# .harness/agents.conf — Agent + Model defaults (git-tracked)
#
# 역할별 agent / 모델 매핑. shell 변수 파일 — 수정 후 커밋 가능.
# 사용자별 override 는 `.harness/agents.local.conf` 에 (gitignore).
#
# 로더: `scripts/agents-conf.sh` 가 이 파일 → local.conf 순으로 source.
# 사용처: scripts/coord-launch.sh, scripts/orca/worker-start.sh, scripts/tasks.sh
#
# 값 규칙:
#   AGENT  — 'claude' | 'codex' | 'cursor' | 'antigravity' | 'muse' | 'zcode'
#            | 'opencode' | 'opencode2' | 'kiro'
#   MODEL  — provider 모델 ID (예: 'claude-sonnet-4-5', 'claude-opus-4-5')
#            또는 'auto' = `--model` flag 미전달 (각 agent 의 자체 설정 사용)
#   비어있음 — DEFAULT 로 fallback

# ─── Coordinator (하나의 Run 당 1 세션, LLM-driven) ─────────────────
# Phase 4 S++ 까지 Opus 기본값이었음 → Sonnet 으로 downgrade (비용 절감)
HARNESS_COORDINATOR_AGENT=claude
HARNESS_COORDINATOR_MODEL=claude-sonnet-4-5

# ─── Worker role 기본값 (role-specific 변수가 비어있을 때 fallback) ──
HARNESS_DEFAULT_AGENT=kiro
HARNESS_DEFAULT_MODEL=auto

# ─── Role-specific override (비워두면 DEFAULT 사용) ─────────────────
# 비싼 reasoning 필요한 역할만 claude+sonnet 으로 올리는 식으로 조정 가능.
HARNESS_PLANNER_AGENT=
HARNESS_PLANNER_MODEL=

HARNESS_ARCHITECT_AGENT=
HARNESS_ARCHITECT_MODEL=

HARNESS_DESIGNER_AGENT=
HARNESS_DESIGNER_MODEL=

HARNESS_BACKEND_AGENT=
HARNESS_BACKEND_MODEL=

HARNESS_FRONTEND_AGENT=
HARNESS_FRONTEND_MODEL=

HARNESS_QA_AGENT=
HARNESS_QA_MODEL=

HARNESS_REVIEWER_AGENT=
HARNESS_REVIEWER_MODEL=
